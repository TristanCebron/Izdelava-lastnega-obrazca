<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <img id="glav_slika" src="slike/bi-logo-rainbow-black-RGB.svg">

    <div id="glavni">

        <p id="sign_text">Create new Account</p>

        <p id="steam"><i class="fa-brands fa-steam"></i> Sign in with Steam</p>

        <p id="face"><i class="fa-brands fa-facebook"></i> Sign in with Facebook</p>

        <p id="goog"><span class="google-icon">G</span> Sign in with Google</p>

        <p id="or">OR</p>

        <input class="input red" type="text" placeholder="Nickname">
        <small>The nickname field is required.</small>

        <input class="input" type="email" placeholder="E-mail">
        <small>The e-mail field is required.</small>

        <input class="input red space" type="email" placeholder="E-mail Confirmation">

        <input class="input" type="password" placeholder="Password">

        <div class="strength">
            <hr><hr><hr><hr><hr>
        </div>

        <input class="input red" type="password" placeholder="Password Confirmation">

        <div class="remember">
            <label class="switch">
                <input type="checkbox">
                <span class="slider round"></span>
            </label>

            <span class="remember-text">
                By creating a Bohemia Interactive Account,
                you accept the User Agreement & Privacy Policy.
            </span>
        </div>

        <button id="signup">SIGN UP</button>

        <div id="captcha">
            <div id="captcha-text">
                zaščiteno s preverjanjem<br>
                reCAPTCHA
            </div>
            <div id="captcha-logo">↻</div>
        </div>

    </div>

    <div id="bottom">
        <hr>
        <button>ALREADY HAVE AN ACCOUNT?</button>
        <hr>
    </div>
</body>
</html>
